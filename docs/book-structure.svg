<svg xmlns="http://www.w3.org/2000/svg" width="820" height="824" viewBox="0 0 820 824" role="img" aria-labelledby="title desc">
  <title id="title">Book folder structure</title>
  <desc id="desc">The folder layout for a Fiction Publisher book: a book folder containing config.yml, an optional images folder, and an outline folder with one subfolder per chapter, each holding numbered scene Markdown files. The .vscode and Fiction-Publisher-Output folders are created by the scripts.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .line { stroke: #8c959f; stroke-width: 1.5; fill: none; }
    .folder { fill: #f2c55c; stroke: #b8860b; stroke-width: 1; }
    .file { fill: #ffffff; stroke: #57606a; stroke-width: 1; }
    .gen { fill: none; stroke: #8c959f; stroke-width: 1; stroke-dasharray: 2 2; }
    .name { font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .name.gen-text { fill: #6e7781; font-style: italic; }
    .note { font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #57606a; }
    .note.gen-text { font-style: italic; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .line { stroke: #6e7681; }
      .folder { fill: #c9a227; stroke: #e3b341; }
      .file { fill: #161b22; stroke: #8b949e; }
      .gen { stroke: #6e7681; }
      .name { fill: #e6edf3; }
      .name.gen-text { fill: #8b949e; }
      .note { fill: #8b949e; }
    }
  </style>

  <rect class="bg" x="0.5" y="0.5" width="819" height="823" rx="8"/>

  <!-- tree connectors -->
  <path class="line" d="M32 56 V560 M32 80 H49 M32 112 H49 M32 176 H49 M32 496 H49 M32 560 H49"/>
  <path class="line" d="M60 120 V144 H77"/>
  <path class="line" d="M60 184 V432 M60 208 H77 M60 272 H77 M60 368 H77 M60 432 H77"/>
  <path class="line" d="M88 216 V240 H105"/>
  <path class="line" d="M88 280 V336 M88 304 H105 M88 336 H105"/>
  <path class="line" d="M88 376 V400 H105"/>
  <path class="line" d="M88 440 V464 H105"/>
  <path class="line" d="M60 504 V528 H77"/>
  <path class="line" d="M60 568 V784 M60 592 H77 M60 624 H77 M60 656 H77 M60 688 H77 M60 720 H77 M60 752 H77 M60 784 H77"/>

  <!-- icons -->
  <defs>
    <path id="folder" d="M0 -6 h6 l2 2 h8 v10 h-16 z"/>
    <path id="file" d="M2 -8 h8 l4 4 v12 h-12 z M10 -8 v4 h4"/>
  </defs>
  <use href="#folder" class="folder" x="24" y="48"/>
  <use href="#file" class="file" x="52" y="80"/>
  <use href="#folder" class="folder" x="52" y="112"/>
  <use href="#file" class="file" x="80" y="144"/>
