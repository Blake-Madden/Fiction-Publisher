  <!-- notes -->
  <text class="note" x="380" y="53">Your book folder (passed with -BookFolder)</text>
  <text class="note" x="380" y="85">Book metadata and build options</text>
  <text class="note" x="380" y="117">Optional (e.g., for the cover-image)</text>
  <text class="note" x="380" y="181">One subfolder per chapter, ordered by number</text>
  <text class="note" x="380" y="213">Unnumbered chapter (no “Chapter N” label)</text>
  <text class="note" x="380" y="277">Chapter 1, titled from the folder name</text>
  <text class="note" x="380" y="309">One Markdown file per scene, ordered by number</text>
  <text class="note" x="380" y="341">End all but the last scene with *** for a separator</text>
  <text class="note" x="380" y="373">Chapter 2, number only (no title)</text>
  <text class="note" x="380" y="437">Unnumbered chapter</text>
  <text class="note gen-text" x="380" y="501">Created by Config.ps1</text>
  <text class="note gen-text" x="380" y="533">Build tasks for VS Codium / VS Code</text>
  <text class="note gen-text" x="380" y="565">Created by Build.ps1 (recreated on each build)</text>
  <text class="note gen-text" x="380" y="597">ePub</text>
  <text class="note gen-text" x="380" y="629">Amazon KDP ePub</text>
  <text class="note gen-text" x="380" y="661">Print-ready PDF</text>
  <text class="note gen-text" x="380" y="693">Word draft</text>
  <text class="note gen-text" x="380" y="725">Formatting issues in the source files (if any)</text>
  <text class="note gen-text" x="380" y="757">Pandoc and LaTeX errors and warnings (if any)</text>
  <text class="note gen-text" x="380" y="789">Intermediate files (kept only if the build fails)</text>
</svg>
