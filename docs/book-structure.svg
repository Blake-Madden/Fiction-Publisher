  <use href="#folder" class="gen" x="80" y="784"/>

  <!-- names -->
  <text class="name" x="48" y="53" font-weight="bold">MyBook/</text>
  <text class="name" x="76" y="85">config.yml</text>
  <text class="name" x="76" y="117">images/</text>
