<svg xmlns="http://www.w3.org/2000/svg" width="820" height="760" viewBox="0 0 820 760" role="img" aria-labelledby="title desc">
  <title id="title">Fiction Publisher folder structure</title>
  <desc id="desc">The layout of the Fiction-Publisher folder: VS Code tasks, docs, the Example book, and the Pandoc folder with its css, fonts, and templates subfolders, plus the Build.ps1 and Config.ps1 scripts and the config.yml schema.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .line { stroke: #8c959f; stroke-width: 1.5; fill: none; }
    .folder { fill: #f2c55c; stroke: #b8860b; stroke-width: 1; }
    .file { fill: #ffffff; stroke: #57606a; stroke-width: 1; }
    .name { font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .note { font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .line { stroke: #6e7681; }
      .folder { fill: #c9a227; stroke: #e3b341; }
      .file { fill: #161b22; stroke: #8b949e; }
      .name { fill: #e6edf3; }
      .note { fill: #8b949e; }
    }
  </style>

